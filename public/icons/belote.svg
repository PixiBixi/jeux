<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Belote">
  <!-- Two fanned cards on felt: the heart behind, the spade in front. Big flat shapes only,
       because a favicon is judged at 16px. Colours follow the felt, cream and gold tokens. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2a9a5e"/>
      <stop offset="1" stop-color="#0b4428"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e8d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#felt)"/>
  <rect x="2" y="2" width="60" height="60" rx="12.5" fill="none" stroke="#f0c35a" stroke-opacity=".55" stroke-width="1.6"/>
  <g transform="rotate(-14 30 34)">
    <rect x="12" y="13" width="26" height="37" rx="4" fill="url(#paper)" stroke="#0b4428" stroke-opacity=".35"/>
    <path transform="translate(-4.5 -4) translate(25 33) scale(.84) translate(-25 -33)" d="M25 41.5c-6.6-4.6-9.6-8-9.6-11.6 0-2.6 2-4.6 4.5-4.6 2.1 0 3.6 1.2 5.1 3.2 1.5-2 3-3.2 5.1-3.2 2.5 0 4.5 2 4.5 4.6 0 3.6-3 7-9.6 11.6z" fill="#c8322f"/>
  </g>
  <g transform="rotate(12 36 34)">
    <rect x="25" y="14" width="27" height="38" rx="4" fill="#000" fill-opacity=".28" transform="translate(1.2 1.6)"/>
    <rect x="25" y="14" width="27" height="38" rx="4" fill="url(#paper)" stroke="#0b4428" stroke-opacity=".35"/>
    <path d="M38.5 21c-3.4 5-9.2 7.6-9.2 13 0 2.8 2.2 4.8 4.8 4.8 1.6 0 2.9-.7 3.6-1.8-.2 1.9-1 3.5-2.6 4.9h6.8c-1.6-1.4-2.4-3-2.6-4.9.7 1.1 2 1.8 3.6 1.8 2.6 0 4.8-2 4.8-4.8 0-5.4-5.8-8-9.2-13z" fill="#16181d"/>
  </g>
</svg>
