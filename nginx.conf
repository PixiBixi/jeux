server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /fonts/ {
        expires 1y;
    }

    location /icons/ {
        expires 7d;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
